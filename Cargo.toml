# SPDX-License-Identifier: GPL-3.0-only

[workspace]

[package]
name = "phantom-camera-rust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"
publish = false
description = "Rust GDExtension port of the Phantom Camera addon (v0.11.0.3) for Godot 4.7."
repository = "https://github.com/notnilcn/godot-phantom-camera-rust"

[lib]
name = "phantom_camera_rust"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.5", features = ["api-4-7"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
